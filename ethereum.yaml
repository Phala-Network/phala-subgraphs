              "0x00000000000000000000000021d6ec8fc14caacc55afa23cba66798dab3a0ec0",
            ]
      file: ./src/token.ts
  - kind: ethereum
    name: Vault
    network: mainnet
    source:
      address: "0x21d6ec8fc14caacc55afa23cba66798dab3a0ec0"
      abi: Vault
      startBlock: 21596326
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities: [VaultState, VaultDay, VaultEvent, Holder, Latest, ChainDay]
      abis:
        - name: Vault
          file: ./abis/Vault.json
      eventHandlers:
        - event: Approval(indexed address,indexed address,uint256)
          handler: handleApproval
          calls:
            checkpointTime: Vault[event.address].checkpointTime()
            checkpointTotalAssets: Vault[event.address].checkpointTotalAssets()
            checkpointTreasuryAssets: Vault[event.address].checkpointTreasuryAssets()
            rewardRate: Vault[event.address].rewardRate()
            treasuryRatio: Vault[event.address].treasuryRatio()
            paused: Vault[event.address].paused()
            totalSupply: Vault[event.address].totalSupply()
        - event: Claimed(indexed address,indexed address,indexed address,uint256)
          handler: handleClaimed
          calls:
            checkpointTime: Vault[event.address].checkpointTime()
            checkpointTotalAssets: Vault[event.address].checkpointTotalAssets()
            checkpointTreasuryAssets: Vault[event.address].checkpointTreasuryAssets()
            rewardRate: Vault[event.address].rewardRate()
            treasuryRatio: Vault[event.address].treasuryRatio()
            paused: Vault[event.address].paused()
            totalSupply: Vault[event.address].totalSupply()
        - event: Deposit(indexed address,indexed address,uint256,uint256)
          handler: handleDeposit
          calls:
            checkpointTime: Vault[event.address].checkpointTime()
            checkpointTotalAssets: Vault[event.address].checkpointTotalAssets()
            checkpointTreasuryAssets: Vault[event.address].checkpointTreasuryAssets()
            rewardRate: Vault[event.address].rewardRate()
            treasuryRatio: Vault[event.address].treasuryRatio()
            paused: Vault[event.address].paused()
            totalSupply: Vault[event.address].totalSupply()
        - event: Initialized(uint64)
          handler: handleInitialized
          calls:
            checkpointTime: Vault[event.address].checkpointTime()
            checkpointTotalAssets: Vault[event.address].checkpointTotalAssets()
            checkpointTreasuryAssets: Vault[event.address].checkpointTreasuryAssets()
            rewardRate: Vault[event.address].rewardRate()
            treasuryRatio: Vault[event.address].treasuryRatio()
            paused: Vault[event.address].paused()
            totalSupply: Vault[event.address].totalSupply()
        - event: MaxUnlockRequestsUpdated(uint256,uint256)
          handler: handleMaxUnlockRequestsUpdated
          calls:
            checkpointTime: Vault[event.address].checkpointTime()
            checkpointTotalAssets: Vault[event.address].checkpointTotalAssets()
            checkpointTreasuryAssets: Vault[event.address].checkpointTreasuryAssets()
            rewardRate: Vault[event.address].rewardRate()
            treasuryRatio: Vault[event.address].treasuryRatio()
            paused: Vault[event.address].paused()
            totalSupply: Vault[event.address].totalSupply()
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
          calls:
            checkpointTime: Vault[event.address].checkpointTime()
            checkpointTotalAssets: Vault[event.address].checkpointTotalAssets()
            checkpointTreasuryAssets: Vault[event.address].checkpointTreasuryAssets()
            rewardRate: Vault[event.address].rewardRate()
            treasuryRatio: Vault[event.address].treasuryRatio()
            paused: Vault[event.address].paused()
            totalSupply: Vault[event.address].totalSupply()
        - event: Paused(address)
          handler: handlePaused
          calls:
            checkpointTime: Vault[event.address].checkpointTime()
            checkpointTotalAssets: Vault[event.address].checkpointTotalAssets()
            checkpointTreasuryAssets: Vault[event.address].checkpointTreasuryAssets()
            rewardRate: Vault[event.address].rewardRate()
