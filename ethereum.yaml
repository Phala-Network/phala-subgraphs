  - kind: ethereum
    name: KhalaClaimer
    network: mainnet
    source:
      address: "0xa139f849000c5438855032ebfeed9ee104023a73"
      abi: KhalaClaimer
      startBlock: 21596400
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities: [Claimed, ClaimedAndBridged, ClaimDay, ChainState]
      abis:
        - name: KhalaClaimer
          file: ./abis/KhalaClaimer.json
      eventHandlers:
        - event: Claimed(indexed address,uint256,uint256,address)
          handler: handleKhalaClaimer
      file: ./src/claimer.ts
  - kind: ethereum
