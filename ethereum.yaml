        - event: TreasurySettled(uint256,uint256,uint256)
          handler: handleTreasurySettled
          calls:
            checkpointTime: Vault[event.address].checkpointTime()
            checkpointTotalAssets: Vault[event.address].checkpointTotalAssets()
            checkpointTreasuryAssets: Vault[event.address].checkpointTreasuryAssets()
            rewardRate: Vault[event.address].rewardRate()
            treasuryRatio: Vault[event.address].treasuryRatio()
            paused: Vault[event.address].paused()
            totalSupply: Vault[event.address].totalSupply()
        - event: UnlockPeriodUpdated(uint256,uint256)
          handler: handleUnlockPeriodUpdated
          calls:
