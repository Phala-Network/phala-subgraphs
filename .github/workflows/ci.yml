name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # Matchstick 0.6.0 links libpq. The runner owns this ephemeral OS package.
      - run: sudo apt-get update && sudo apt-get install -y libpq5
      - run: bun install --frozen-lockfile
      - run: bun run codegen
      - run: bun run build
      - run: bun run test
      - run: bun run test:verify
      - run: bun run typecheck
      - run: bun run check
